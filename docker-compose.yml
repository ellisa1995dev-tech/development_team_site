services:
  postgres:
    image: postgres:16-alpine
    container_name: team_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: team
      POSTGRES_PASSWORD: team_password
      POSTGRES_DB: team_site
    ports:
      - "5432:5432"
    volumes:
      - team_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team -d team_site"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  team_pgdata:
